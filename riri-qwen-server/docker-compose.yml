services:
  qwen:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    command: ["--model","Qwen/Qwen3.8-27B-FP8","--served-model-name","qwen3.8","--host","0.0.0.0","--port","8000","--max-model-len","16384","--gpu-memory-utilization","0.92"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    expose: ["8000"]
  bridge:
    image: node:24-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    command: node server.mjs
    env_file: .env
    environment:
      QWEN_BASE_URL: http://qwen:8000
      QWEN_MODEL: qwen3.8
      RIRI_HOST: 0.0.0.0
      RIRI_PORT: 8787
      RIRI_DB_PATH: /data/riri.sqlite
    volumes:
      - ./:/app:ro
      - riri-data:/data
    depends_on: [qwen]
    expose: ["8787"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports: ["80:80","443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [bridge]
volumes:
  hf-cache:
  riri-data:
  caddy-data:
  caddy-config:
