name = "riri-qwen-cloud"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "riri-qwen-d1"
database_id = "REPLACE_WITH_YOUR_D1_UUID"

[vars]
OWN_USER_ID = "REPLACE_WITH_OWN_NUMERIC_X_ID"
X_POLL_ENABLED = "false"
AUTO_SEND_ENABLED = "false"
INTERNAL_FREE_CENTS = "1500"
ESTIMATED_REQUEST_CENTS = "25"
