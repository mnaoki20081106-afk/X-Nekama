name = "riri-qwen-cloud"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "riri-qwen-d1"
database_id = "REPLACE_WITH_YOUR_D1_UUID"

[vars]
OWN_USER_ID = "REPLACE_WITH_OWN_NUMERIC_X_ID"
X_POLL_ENABLED = "false"
AUTO_SEND_ENABLED = "false"
INTERNAL_FREE_CENTS = "1500"
ESTIMATED_REQUEST_CENTS = "25"
X_POLL_EVERY_MINUTES = "2"
DM_QUIET_MS = "60000"
MAX_GROUPS_PER_TICK = "2"

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
