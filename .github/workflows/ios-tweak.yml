name: iOS IPA Build

on:
  push:
    paths:
      - "ios-tweak/**"
      - ".github/workflows/ios-tweak.yml"
  pull_request:
    paths:
      - "ios-tweak/**"
      - ".github/workflows/ios-tweak.yml"
  workflow_dispatch:
    inputs:
      build_ipa:
        description: Build the complete SideStore IPA
        type: boolean
        default: true
      source_ipa_url:
        description: Optional temporary HTTPS URL for X.ipa when Drive credentials are unavailable
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  # One-run bootstrap only. This signed URL is removed immediately after the
  # complete IPA path is proven in Actions.
  BOOTSTRAP_SOURCE_IPA_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-56b0-8209-9a41-5f635fc874df/raw?se=2026-10-03T13%3A02%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=2c63a8b8-cbfe-5f09-92d6-abcd6432db31&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T02%3A46%3A49Z&ske=2026-10-04T02%3A46%3A49Z&sks=b&skv=2026-02-06&sig=NlhlqXshco32IFHu/Y2z9v7KUqXjzHnD5qAYw3UZxTw%3D"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select IPA source
        id: ipa
        env:
          DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          BUILD_IPA: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ipa }}
          INPUT_SOURCE_IPA_URL: ${{ inputs.source_ipa_url }}
        run: |
          set -euo pipefail

          if [[ "$BUILD_IPA" != "true" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'source=none' >> "$GITHUB_OUTPUT"
            echo 'Complete IPA build disabled for this run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -n "$DRIVE_CREDENTIALS" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'source=drive' >> "$GITHUB_OUTPUT"
            echo 'Using private Google Drive service-account access.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SOURCE_URL="$INPUT_SOURCE_IPA_URL"
          if [[ -z "$SOURCE_URL" ]]; then
            SOURCE_URL="$BOOTSTRAP_SOURCE_IPA_URL"
          fi

          if [[ -n "$SOURCE_URL" ]]; then
            if [[ "$SOURCE_URL" != https://* ]]; then
              echo '::error::source_ipa_url must use HTTPS.'
              exit 1
            fi
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'source=url' >> "$GITHUB_OUTPUT"
            echo 'Using a temporary HTTPS source for this IPA build.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'enabled=false' >> "$GITHUB_OUTPUT"
          echo 'source=none' >> "$GITHUB_OUTPUT"
          echo '### Complete IPA source not configured' >> "$GITHUB_STEP_SUMMARY"
          echo 'The tweak build and tests will still run successfully.' >> "$GITHUB_STEP_SUMMARY"
          echo 'For a complete IPA, configure GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON or provide a temporary source_ipa_url when manually running the workflow.' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python for Drive preflight
        if: steps.ipa.outputs.source == 'drive'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Drive preflight dependencies
        if: steps.ipa.outputs.source == 'drive'
        run: python3 -m pip install 'google-auth==2.40.3' 'requests==2.32.5'

      - name: Verify private Drive source IPA access
        if: steps.ipa.outputs.source == 'drive'
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          X_IPA_DRIVE_FILE_ID: '1sjlSvgpnobrW0ycn-P-DYr7371HaIkGG'
        run: python3 ios-tweak/download_source_ipa.py --check-only

      - name: Install build dependencies
        run: brew install make dpkg ldid

      - name: Add GNU Make to PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Install iOS 16.5 SDK
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk "$THEOS/sdks/"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build X-Nekama tweak
        run: |
          cd ios-tweak
          make clean
          make package
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Test native Grok result handling
        run: |
          swiftc -module-name Grok ios-tweak/NativeGrok.swift ios-tweak/tests/NativeGrokTests.swift -o /tmp/native-grok-tests
          /tmp/native-grok-tests

      - name: Test VPN gate policy
        run: |
          c++ -std=c++11 ios-tweak/tests/VPNPolicyTests.cpp -o /tmp/vpn-policy-tests
          /tmp/vpn-policy-tests

      - name: Test IPA download and verification helpers
        run: python3 -m unittest discover -s ios-tweak/tests -p 'test_*.py'

      - name: Install IPA packaging dependency
        if: steps.ipa.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          PYZULE_VENV="$RUNNER_TEMP/pyzule-venv"
          python3 -m venv "$PYZULE_VENV"
          "$PYZULE_VENV/bin/python" -m pip install --upgrade pip
          "$PYZULE_VENV/bin/python" -m pip install 'https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip'
          echo "$PYZULE_VENV/bin" >> "$GITHUB_PATH"
          "$PYZULE_VENV/bin/cyan" --help >/dev/null

      - name: Download private source IPA from Google Drive
        if: steps.ipa.outputs.source == 'drive'
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          X_IPA_DRIVE_FILE_ID: '1sjlSvgpnobrW0ycn-P-DYr7371HaIkGG'
        run: python3 ios-tweak/download_source_ipa.py --output "$RUNNER_TEMP/X-source.ipa"

      - name: Download source IPA from temporary HTTPS URL
        if: steps.ipa.outputs.source == 'url'
        env:
          INPUT_SOURCE_IPA_URL: ${{ inputs.source_ipa_url }}
        run: |
          set -euo pipefail
          SOURCE_URL="$INPUT_SOURCE_IPA_URL"
          if [[ -z "$SOURCE_URL" ]]; then
            SOURCE_URL="$BOOTSTRAP_SOURCE_IPA_URL"
          fi
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            --output "$RUNNER_TEMP/X-source.ipa" "$SOURCE_URL"
          test -s "$RUNNER_TEMP/X-source.ipa"
          SOURCE_SIZE="$(stat -f%z "$RUNNER_TEMP/X-source.ipa")"
          if (( SOURCE_SIZE < 1000000 || SOURCE_SIZE > 1073741824 )); then
            echo "::error::Unexpected source IPA size: $SOURCE_SIZE bytes"
            exit 1
          fi
          python3 ios-tweak/verify_ipa.py "$RUNNER_TEMP/X-source.ipa"

      - name: Build complete SideStore IPA
        if: steps.ipa.outputs.enabled == 'true'
        env:
          THEOS: ${{ github.workspace }}/theos
          IPA_PATH: ${{ runner.temp }}/X-source.ipa
        run: bash ios-tweak/build.sh --sidestore

      - name: Write IPA checksum and build summary
        if: steps.ipa.outputs.enabled == 'true'
        run: |
          cd ios-tweak/packages
          shasum -a 256 X-Nekama-X12.29.ipa > X-Nekama-X12.29.ipa.sha256
          echo '### Complete IPA ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **X-Nekama-IPA** from this run’s Artifacts. Unzip it, then sign/install the IPA with SideStore.' >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete IPA
        if: steps.ipa.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: X-Nekama-IPA
          path: |
            ios-tweak/packages/X-Nekama-X12.29.ipa
            ios-tweak/packages/X-Nekama-X12.29.ipa.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload tweak package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X-Nekama-tweak
          path: ios-tweak/packages/*.deb
          if-no-files-found: ignore
