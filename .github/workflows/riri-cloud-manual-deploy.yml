name: Riri Cloudflare manual deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: riri-cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OWN_USER_ID: ${{ secrets.RIRI_OWN_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check required Cloudflare connection
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "$OWN_USER_ID" | grep -Eq '^[0-9]{1,30}$'
      - name: Provision database config
        run: python bootstrap_d1.py
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Initialize remote D1
        run: npx wrangler d1 execute riri-qwen-d1 --remote --file=./schema.sql --yes
      - name: Deploy Worker and mobile admin screen
        run: npx wrangler deploy
