name: Riri cloud and Modal checks
on:
  push:
    branches: ['codex/riri-modal-free-budget-20261008']
    paths: ['riri-cloud/**', 'riri-modal/**', '.github/workflows/riri-cloud-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Worker unit tests
        run: node --test riri-cloud/tests/*.test.mjs
      - name: Worker JS syntax
        run: node --check riri-cloud/worker.mjs
      - name: Modal Python syntax
        run: python -m py_compile riri-modal/app.py
