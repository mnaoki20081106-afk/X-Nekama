name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check server.mjs
      - run: node --check x.mjs
      - run: node --check egress.mjs
      - run: node --check vpn-egress.mjs
      - run: node --check public/app.js
      - run: node --check cloudflare/src/index.mjs
      - run: node --check cloudflare/setup.mjs
      - name: Install Cloudflare build dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts
      - name: Validate Cloudflare bundle
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run --config wrangler.ci.toml --outdir .wrangler-dry-run
      - name: Validate Deploy-to-Cloudflare template
        run: npx --yes wrangler@4.102.0 deploy --dry-run --config wrangler.toml --outdir .wrangler-template-dry-run
